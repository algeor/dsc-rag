<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Where RAG Truth Gets Lost</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />

<style>
  :root {
    --bg: #02030a;
    --panel: #07111e;
    --panel-2: #0a0d19;
    --line: rgba(84, 96, 112, 0.28);
    --grid: rgba(84, 96, 112, 0.14);
    --cyan: #00e5ff;
    --magenta: #ff2bd6;
    --lime: #a6ff00;
    --amber: #ffd166;
    --red: #ff3b5f;
    --violet: #8a5cff;
    --white: #f8fafc;
    --muted: #93a4b8;
    --dim: #546070;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --disp: "Chakra Petch", var(--sans);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--white);
    font-family: var(--sans);
  }

  /* ---- viewport + scaling stage ---------------------------------- */
  #viewport {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      radial-gradient(circle at 85% 10%, rgba(0, 229, 255, 0.12), transparent 32%),
      radial-gradient(circle at 8% 88%, rgba(255, 43, 214, 0.1), transparent 34%),
      var(--bg);
    background-size: 64px 64px, 64px 64px, auto, auto, auto;
  }

  #deck {
    position: relative;
    width: 1280px;
    height: 720px;
    transform-origin: center center;
  }

  .slide {
    position: absolute;
    inset: 0;
    padding: 52px 64px 56px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
  }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity 0.2s linear; transform: none; }
  }

  /* ---- shared chrome --------------------------------------------- */
  .eyebrow {
    font-family: var(--disp);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--cyan);
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 14px;
  }
  .eyebrow::before {
    content: "";
    width: 9px; height: 9px;
    background: currentColor;
    box-shadow: 0 0 12px currentColor;
    transform: rotate(45deg);
  }
  .eyebrow .seg { color: var(--dim); letter-spacing: 0.26em; }

  h2.headline {
    font-family: var(--disp);
    font-weight: 700;
    font-size: 40px;
    line-height: 1.02;
    margin: 0;
    max-width: 1040px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .headline .hl { color: var(--cyan); }
  .headline .hl.lime { color: var(--lime); }
  .headline .hl.mag { color: var(--magenta); }
  .headline .hl.red { color: var(--red); }

  .subhead {
    margin: 14px 0 0;
    font-size: 19px;
    line-height: 1.4;
    color: var(--muted);
    max-width: 940px;
  }

  .body {
    flex: 1;
    min-height: 0;
    margin-top: 26px;
    display: flex;
    flex-direction: column;
  }

  /* progress + footer */
  #hud {
    position: absolute;
    left: 64px; right: 64px; bottom: 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.08em;
    z-index: 20;
  }
  #progress {
    flex: 1;
    height: 2px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  #progress i {
    position: absolute;
    inset: 0 auto 0 0;
    background: linear-gradient(90deg, var(--cyan), var(--lime));
    width: 0;
    transition: width 0.5s ease;
    box-shadow: 0 0 10px var(--cyan);
  }
  #counter b { color: var(--white); font-weight: 600; }
  #hint { color: var(--dim); }
  #hint kbd {
    font-family: var(--mono);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--muted);
  }

  .corner {
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid var(--line);
    z-index: 20;
  }
  .corner.tl { top: 20px; left: 24px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 20px; right: 24px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 56px; left: 24px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 56px; right: 24px; border-left: 0; border-top: 0; }

  /* ---- reusable atoms -------------------------------------------- */
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .tag {
    font-family: var(--disp);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
  }
  .mono { font-family: var(--mono); }
  code, .code {
    font-family: var(--mono);
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 0.86em;
    color: var(--cyan);
  }
  .cite {
    font-family: var(--mono);
    font-size: 0.82em;
    color: var(--lime);
    background: rgba(166, 255, 0, 0.1);
    border-radius: 4px;
    padding: 0 4px;
  }

  /* ===== Slide 1 — title ========================================= */
  .title-slide { justify-content: center; }
  .title-slide .eyebrow { font-size: 15px; }
  .big-title {
    font-family: var(--disp);
    font-weight: 700;
    font-size: 76px;
    line-height: 0.98;
    letter-spacing: -0.02em;
    margin: 10px 0 0;
    max-width: 900px;
  }
  .big-title .glow { color: var(--cyan); text-shadow: 0 0 30px rgba(0, 229, 255, 0.5); }
  .title-slide .lead {
    margin: 26px 0 0;
    font-size: 21px;
    color: var(--muted);
    max-width: 620px;
    line-height: 1.45;
  }
  .title-pipe {
    position: absolute;
    right: 64px;
    top: 50%;
    transform: translateY(-50%);
    width: 420px;
  }
  .title-q {
    margin-top: 34px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-left: 3px solid var(--magenta);
    background: rgba(255, 43, 214, 0.06);
    border-radius: 0 10px 10px 0;
    font-family: var(--mono);
    font-size: 16px;
    color: var(--white);
    max-width: 620px;
  }
  .title-q .qmark { color: var(--magenta); font-size: 22px; }

  /* ===== generic two-column body ================================= */
  .cols {
    display: grid;
    gap: 28px;
    flex: 1;
    min-height: 0;
  }
  .cols.c12 { grid-template-columns: 1fr 1fr; }
  .cols.c-37 { grid-template-columns: 0.82fr 1.18fr; }
  .cols.c-55 { grid-template-columns: 1fr 1fr; }

  .figwrap {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .figwrap svg { width: 100%; height: auto; }
  figure { margin: 0; display: flex; flex-direction: column; height: 100%; }
  figcaption {
    margin-top: 12px;
    font-size: 13.5px;
    color: var(--dim);
    font-family: var(--mono);
    letter-spacing: 0.02em;
  }

  .note-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .note-list li {
    display: flex;
    gap: 14px;
    font-size: 16.5px;
    line-height: 1.4;
    color: var(--white);
  }
  .note-list li .k {
    flex: none;
    font-family: var(--disp);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cyan);
    width: 128px;
    padding-top: 2px;
  }
  .note-list li .k.vi { color: var(--violet); }
  .note-list li .k.mg { color: var(--magenta); }
  .note-list li .k.am { color: var(--amber); }
  .note-list li .k.lm { color: var(--lime); }
  .note-list li .v { color: var(--muted); }
  .note-list li .v b { color: var(--white); font-weight: 600; }

  .callout {
    margin-top: auto;
    padding: 14px 18px;
    border: 1px dashed rgba(255, 209, 102, 0.4);
    background: rgba(255, 209, 102, 0.06);
    border-radius: 10px;
    font-size: 15px;
    color: var(--amber);
    line-height: 1.4;
  }
  .callout b { color: var(--white); }

  /* ===== button-slide specific =================================== */
  .stepper {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
    margin-bottom: 22px;
  }
  .step {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 8px 10px;
    background: var(--panel-2);
    opacity: 0.4;
    transition: opacity 0.3s;
    overflow: hidden;
  }
  .step .n {
    font-family: var(--disp);
    font-weight: 700;
    font-size: 12px;
    color: var(--dim);
  }
  .step .nm {
    font-family: var(--disp);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.15;
    display: block;
  }
  .step.done { opacity: 1; }
  .step.done .n { color: var(--accent, var(--cyan)); }
  .step.active {
    opacity: 1;
    border-color: var(--accent, var(--cyan));
    background: color-mix(in srgb, var(--accent, var(--cyan)) 14%, var(--panel-2));
    box-shadow: 0 0 0 1px var(--accent, var(--cyan)), 0 0 24px -6px var(--accent, var(--cyan));
  }
  .step.active .n, .step.active .nm { color: var(--accent, var(--cyan)); }
  .step.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: var(--accent, var(--cyan));
    box-shadow: 0 0 12px var(--accent, var(--cyan));
  }

  .bslide-body { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; flex: 1; min-height: 0; }

  .whatsnew { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .added-card {
    border: 1px solid var(--accent, var(--cyan));
    border-radius: 12px;
    padding: 16px 18px;
    background: color-mix(in srgb, var(--accent, var(--cyan)) 8%, var(--panel));
  }
  .added-card .tag { color: var(--accent, var(--cyan)); }
  .added-card .added-text {
    margin: 8px 0 0;
    font-size: 17px;
    line-height: 1.4;
    color: var(--white);
  }
  .added-card .added-text b { color: var(--accent, var(--cyan)); }

  .mech {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mech svg { width: 100%; height: auto; max-height: 300px; }

  /* answer card (right column) */
  .answer-card {
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }
  .answer-card .ac-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .ac-head .who { font-family: var(--disp); font-size: 12px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
  .verdict {
    font-family: var(--disp);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid currentColor;
  }
  .verdict.bad { color: var(--red); background: rgba(255, 59, 95, 0.12); }
  .verdict.warn { color: var(--amber); background: rgba(255, 209, 102, 0.12); }
  .verdict.ok { color: var(--cyan); background: rgba(0, 229, 255, 0.12); }
  .verdict.good { color: var(--lime); background: rgba(166, 255, 0, 0.12); }
  .verdict.mag { color: var(--magenta); background: rgba(255, 43, 214, 0.12); }

  .ac-answer {
    padding: 16px 18px;
    font-size: 16px;
    line-height: 1.5;
    color: var(--white);
    flex: 1;
    min-height: 0;
  }
  .ac-answer .tbl { font-family: var(--mono); color: var(--cyan); font-weight: 600; }
  .ac-answer .tbl.dep { color: var(--red); text-decoration: line-through; text-decoration-color: rgba(255,59,95,.6); }
  .ac-answer .hot { color: var(--amber); font-weight: 600; }

  .metrics {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    border-top: 1px solid var(--line);
  }
  .metric { padding: 13px 18px; }
  .metric + .metric { border-left: 1px solid var(--line); }
  .metric .tag { font-size: 10px; }
  .conf-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .conf-track { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .conf-track i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--cyan), var(--lime)); box-shadow: 0 0 10px rgba(0,229,255,.5); transition: width .5s; }
  .conf-num { font-family: var(--disp); font-weight: 700; font-size: 20px; min-width: 60px; }
  .rank-val { font-family: var(--disp); font-weight: 700; font-size: 22px; margin-top: 6px; }
  .rank-val small { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .05em; }
  .delta { font-size: 12.5px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }
  .delta .up { color: var(--lime); }
  .delta .flat { color: var(--dim); }

  /* corpus grid (slide 5) */
  .corpus { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .doc {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 9px;
    background: var(--panel-2);
  }
  .doc .did { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .doc .dt { font-size: 12.5px; margin-top: 2px; line-height: 1.2; color: var(--white); }
  .doc .ds { font-family: var(--disp); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; margin-top: 5px; }
  .doc.dep { border-color: rgba(255,59,95,.5); background: rgba(255,59,95,.07); }
  .doc.dep .ds { color: var(--red); }
  .doc.key { border-color: rgba(0,229,255,.5); background: rgba(0,229,255,.07); }
  .doc.key .ds { color: var(--cyan); }
  .doc.pol { border-color: rgba(166,255,0,.4); }
  .doc.pol .ds { color: var(--lime); }
  .doc .ds.act { color: var(--dim); }

  .legend { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--muted); font-family: var(--mono); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; border: 1px solid; }
  .legend i.dep { border-color: var(--red); background: rgba(255,59,95,.2); }
  .legend i.key { border-color: var(--cyan); background: rgba(0,229,255,.2); }
  .legend i.pol { border-color: var(--lime); background: rgba(166,255,0,.2); }

  .pillrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .pill {
    font-family: var(--disp);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 22px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .pill.on { color: var(--bg); }

  /* takeaway pillars */
  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
  .pillar { border-radius: 12px; border: 1px solid var(--line); padding: 16px; background: var(--panel-2); }
  .pillar .pn { font-family: var(--disp); font-weight: 700; font-size: 15px; letter-spacing: .04em; }
  .pillar .pd { font-size: 13.5px; color: var(--muted); margin-top: 6px; line-height: 1.35; }

  svg text { font-family: var(--mono); }
  .svg-label { font-family: var(--disp); font-weight: 600; }

  /* live-demo overlay */
  #demoOverlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column;
    background: var(--bg);
    transform: translateY(100%);
    transition: transform .42s cubic-bezier(.22, .61, .36, 1);
    pointer-events: none;
  }
  #demoOverlay.open { transform: translateY(0); pointer-events: auto; }
  #demoBar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 18px;
    padding: 10px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel); font-family: var(--mono); font-size: 13px;
  }
  #demoBar .db-title {
    font-family: var(--disp); font-weight: 700; letter-spacing: .09em;
    color: var(--lime); display: flex; align-items: center; gap: 9px;
  }
  #demoBar .db-title::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--lime); box-shadow: 0 0 10px var(--lime);
  }
  #demoBar .db-hint { color: var(--muted); }
  #demoBar .db-url { color: var(--cyan); font-size: 12px; opacity: .8; }
  #demoBar #demoReload, #demoBar #demoClose {
    background: transparent; border: 1px solid var(--line);
    color: var(--muted); border-radius: 8px; padding: 5px 12px; cursor: pointer;
    font-family: var(--mono); font-size: 13px; line-height: 1;
  }
  #demoBar #demoReload { margin-left: auto; }
  #demoBar #demoReload:hover, #demoBar #demoClose:hover { color: var(--white); border-color: var(--muted); }
  #demoFrame { flex: 1 1 auto; width: 100%; border: 0; background: var(--bg); }
  #demoFallback {
    position: absolute; inset: 44px 0 0 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px; color: var(--muted); font-family: var(--mono); font-size: 15px; line-height: 1.6;
  }
  #demoFallback code { color: var(--cyan); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { #demoOverlay { transition: none; } }
</style>

<div id="viewport">
  <div id="deck"></div>
</div>

<div id="hud">
  <span id="counter"><b>01</b> / 14</span>
  <div id="progress"><i></i></div>
  <span id="hint"><kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>F</kbd> fullscreen &nbsp;·&nbsp; <kbd>D</kbd> live demo</span>
</div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div id="demoOverlay" aria-hidden="true">
  <div id="demoBar">
    <span class="db-title">LIVE DEMO</span>
    <span class="db-url" id="demoUrl"></span>
    <span class="db-hint"><kbd>D</kbd> / <kbd>Esc</kbd> back to slides</span>
    <button id="demoReload" aria-label="Reload demo">⟳ reload</button>

  </div>
  <iframe id="demoFrame" title="RAG truth live demo"></iframe>
  <div id="demoFallback">

    then press <kbd>D</kbd> again.
  </div>
</div>

<script>
/* ======================================================================

   ====================================================================== */
const CONF  = [32, 38, 60, 66, 67, 82, 94, 99];
const RANK  = ["#4", "#3", "#2", "#1", "#1", "#1", "#1", "#1"];

const BUTTONS = [
  {

    sub: "Raw BM25 over all 16 documents. Whatever ranks #1 becomes the answer — no filter, no policy, no check.",
    addedTag: "Baseline — nothing added",
    added: "Plain keyword relevance (BM25) across <b>every</b> document, stale or not. The system trusts rank&nbsp;#1 blindly.",
    verdict: "Confidently wrong", vclass: "bad",
    answer: 'Use <span class="tbl dep">finance.daily_revenue</span> [01_legacy] — it is the top source retrieved. The canonical contract [02_contract] is outranked, down at position&nbsp;4. <span class="hot">Yesterday\'s data is ready to use.</span>',

    mech: mechNaive(),

  {
    n: 2, key: "indexing", name: "Indexing", accent: "var(--violet)",
    sub: "Index the title, metadata and body together as one searchable chunk — a richer surface to match against.",
    addedTag: "+ Indexing",
    added: "Each doc is indexed as <b>title + metadata + text</b>, not just raw body. Better matching — but stale docs are still in the pool.",

  const line = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const area = `${pad},${h-30} ${line} ${xs[n-1].toFixed(1)},${h-30}`;
  const labels = BUTTONS.map(b=>b.name);
  return `<section class="slide">

        <polyline points="${line}" fill="none" stroke="url(#confLine)" stroke-width="3"/>
        ${CONF.map((c,i)=>`
          <circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i===0||i===n-1?6:4.5}" fill="${BUTTONS[i].accent}" stroke="#02030a" stroke-width="2"/>
          <text x="${xs[i].toFixed(1)}" y="${(ys[i]-14).toFixed(1)}" font-size="13" fill="${BUTTONS[i].accent}" text-anchor="middle" class="svg-label" font-weight="700">${c}</text>
          <text x="${xs[i].toFixed(1)}" y="${h-12}" font-size="10" fill="#93a4b8" text-anchor="middle">0${i+1}</text>
          <text x="${xs[i].toFixed(1)}" y="${h-1}" font-size="9" fill="#546070" text-anchor="middle">${labels[i].split(' ')[0]}</text>
        `).join('')}
        <line x1="${xs[2].toFixed(1)}" y1="20" x2="${xs[2].toFixed(1)}" y2="${h-30}" stroke="#00e5ff" stroke-dasharray="3 5" opacity="0.5"/>
        <text x="${(+xs[2]+6).toFixed(1)}" y="34" font-size="10" fill="#00e5ff">stale docs filtered out</text>
        <line x1="${xs[6].toFixed(1)}" y1="20" x2="${xs[6].toFixed(1)}" y2="${h-30}" stroke="#a6ff00" stroke-dasharray="3 5" opacity="0.5"/>
        <text x="${(+xs[6]-6).toFixed(1)}" y="34" font-size="10" fill="#a6ff00" text-anchor="end">live check gates the answer</text>
      </svg>
      <figcaption>Retrieval confidence (0–99), captured from the live demo at each of the eight stages.</figcaption>
    </figure>
    <div class="pillars">
      <div class="pillar"><p class="pn" style="color:var(--cyan)">Scope &amp; filter</p><p class="pd">Metadata filtering drops deprecated sources before ranking — the single biggest jump.</p></div>
      <div class="pillar"><p class="pn" style="color:var(--magenta)">Authority</p><p class="pd">When sources conflict, let contracts and policies outrank Slack and snapshots.</p></div>
      <div class="pillar"><p class="pn" style="color:var(--lime)">Live evidence</p><p class="pd">Docs explain meaning; a query-time check decides whether today's data is usable.</p></div>
      <div class="pillar"><p class="pn" style="color:var(--amber)">Measure it</p><p class="pd">A pretty demo isn't an evaluation. Confidence here is illustrative — real trust needs a labelled test set.</p></div>
    </div>
  </section>`;
}

/* ======================================================================
   ASSEMBLE + NAVIGATION
   ====================================================================== */
const slides = [
  slideTitle(),
  slideWhatIsRag(),
  slideChunkIndex(),
  slideRetrievalRerank(),
  slideUseCase(),
  ...BUTTONS.map((b,i)=>slideButton(b,i)),
  slideTakeaway(),
];
const deck = document.getElementById("deck");
deck.innerHTML = slides.join("");
const slideEls = [...deck.querySelectorAll(".slide")];
const total = slideEls.length;

let cur = 0;
const counter = document.getElementById("counter");
const progressBar = document.querySelector("#progress i");

function show(i) {
  cur = Math.max(0, Math.min(total - 1, i));
  slideEls.forEach((s, idx) => s.classList.toggle("active", idx === cur));
  counter.innerHTML = `<b>${String(cur + 1).padStart(2, "0")}</b> / ${total}`;
  progressBar.style.width = `${((cur + 1) / total) * 100}%`;
  location.hash = String(cur + 1);
}
function next() { show(cur + 1); }
function prev() { show(cur - 1); }

/* ---- live demo overlay ------------------------------------------------
   Embeds the running demo (scripts/ui_server.py, default port 8765) in an
   iframe. Override the address with ?demo=http://host:port/ if you run the
   server somewhere else. */
const DEMO_URL = (() => {
  const q = new URLSearchParams(location.search).get("demo");
  if (q) return q;
  // If the deck itself is served FROM the demo server, same-origin works;
  // otherwise fall back to the demo server's default local address.
  if (location.port === "8765") return "/";
  return "http://127.0.0.1:8765/";
})();
const overlay = document.getElementById("demoOverlay");
const demoFrame = document.getElementById("demoFrame");
const fallback = document.getElementById("demoFallback");
document.getElementById("demoUrl").textContent = DEMO_URL;
let demoOpen = false, fallbackTimer = null;

demoFrame.addEventListener("load", () => {
  // a real page (not about:blank) came back → hide the "server down" hint
  if (demoFrame.src && !demoFrame.src.startsWith("about:")) {
    demoFrame.dataset.loaded = "1";
    fallback.style.display = "none";
    clearTimeout(fallbackTimer);
  }
});

function loadDemo() {
  // force a fresh load even if the URL is unchanged (about:blank → real url)
  fallback.style.display = "none";
  demoFrame.dataset.loaded = "";
  demoFrame.src = "about:blank";
  requestAnimationFrame(() => { demoFrame.src = DEMO_URL; });
  clearTimeout(fallbackTimer);
  fallbackTimer = setTimeout(() => {
    if (!demoFrame.dataset.loaded) fallback.style.display = "flex";
  }, 3000);
}
function openDemo() {
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  demoOpen = true;
  if (!demoFrame.dataset.loaded) loadDemo();   // first open, or after a failed attempt
}
function closeDemo() {
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");
  demoOpen = false;
}
function toggleDemo() { demoOpen ? closeDemo() : openDemo(); }
document.getElementById("demoClose").addEventListener("click", closeDemo);
document.getElementById("demoReload").addEventListener("click", loadDemo);

document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "d") { e.preventDefault(); toggleDemo(); return; }
  if (e.key === "Escape") { if (demoOpen) { e.preventDefault(); closeDemo(); } return; }
  if (k === "f") {
    e.preventDefault();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
    return;
  }
  if (demoOpen) return;   // slides stay put while the demo is up
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "Home") { show(0); }
  else if (e.key === "End") { show(total - 1); }
});

// click to advance (ignore clicks on the HUD / left third = back)
document.getElementById("viewport").addEventListener("click", (e) => {
  if (demoOpen) return;
  const x = e.clientX / window.innerWidth;
  if (x < 0.25) prev(); else next();
});

// scale the fixed 1280x720 deck to fit the viewport
function fit() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  deck.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit);
fit();

const start = parseInt(location.hash.replace("#", ""), 10);
show(Number.isFinite(start) && start >= 1 ? start - 1 : 0);
</script>
</body>
