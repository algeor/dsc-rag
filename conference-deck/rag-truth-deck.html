<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Where RAG Truth Gets Lost</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" />

<style>
  :root {
    /* warm-editorial light theme */
    --bg: #f7f2ea;          /* warm paper */
    --panel: #fffdf9;       /* card / warm white */
    --panel-2: #efe9dd;     /* inset / tint */
    --line: rgba(61, 52, 40, 0.16);
    --grid: rgba(61, 52, 40, 0.05);
    --accent: #c0532f;      /* terracotta — chrome accent */
    --accent-ink: #a8431f;  /* deeper terracotta for highlights */
    /* retoned semantic hues (deepened for ink-on-paper) */
    --cyan: #0e7d94;        /* retrieve / canonical / right table */
    --magenta: #a52c75;     /* authority / policy */
    --lime: #4f7314;        /* live state / grounded / ready */
    --amber: #9a6a00;       /* rerank / refined / warn */
    --red: #c0392b;         /* deprecated / wrong */
    --violet: #8a5a9e;      /* index / expansion / generate */
    --white: #211d17;       /* primary ink */
    --muted: #6a6153;       /* secondary ink */
    --dim: #8d8472;         /* tertiary ink */
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "Inter", system-ui, sans-serif;
    --disp: "Inter", var(--sans);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--white);
    font-family: var(--sans);
  }

  /* ---- viewport + scaling stage ---------------------------------- */
  #viewport {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      radial-gradient(circle at 85% 10%, rgba(192, 83, 47, 0.07), transparent 32%),
      radial-gradient(circle at 8% 88%, rgba(154, 106, 0, 0.06), transparent 34%),
      var(--bg);
    background-size: 64px 64px, 64px 64px, auto, auto, auto;
  }

  #deck {
    position: relative;
    width: 1280px;
    height: 720px;
    transform-origin: center center;
  }

  .slide {
    position: absolute;
    inset: 0;
    padding: 52px 64px 56px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
  }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity 0.2s linear; transform: none; }
  }

  /* ---- shared chrome --------------------------------------------- */
  .eyebrow {
    font-family: var(--disp);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 14px;
  }
  .eyebrow::before {
    content: "";
    width: 9px; height: 9px;
    background: currentColor;
    transform: rotate(45deg);
  }
  .eyebrow .seg { color: var(--dim); letter-spacing: 0.26em; }

  h2.headline {
    font-family: var(--disp);
    font-weight: 800;
    font-size: 46px;
    line-height: 1.02;
    margin: 0;
    max-width: 1040px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .headline .hl { color: var(--accent-ink); }
  .headline .hl.lime { color: var(--lime); }
  .headline .hl.mag { color: var(--magenta); }
  .headline .hl.red { color: var(--red); }

  .subhead {
    margin: 14px 0 0;
    font-size: 22px;
    line-height: 1.4;
    color: var(--muted);
    max-width: 940px;
  }

  .body {
    flex: 1;
    min-height: 0;
    margin-top: 26px;
    display: flex;
    flex-direction: column;
  }

  /* progress + footer */
  #hud {
    position: absolute;
    left: 64px; right: 64px; bottom: 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.08em;
    z-index: 20;
  }
  #progress {
    flex: 1;
    height: 2px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  #progress i {
    position: absolute;
    inset: 0 auto 0 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-ink));
    width: 0;
    transition: width 0.5s ease;
  }
  #counter b { color: var(--white); font-weight: 600; }
  #hint { color: var(--dim); }
  #hint kbd {
    font-family: var(--mono);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--muted);
  }

  .corner {
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid var(--line);
    z-index: 20;
  }
  .corner.tl { top: 20px; left: 24px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 20px; right: 24px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 56px; left: 24px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 56px; right: 24px; border-left: 0; border-top: 0; }

  /* ---- reusable atoms -------------------------------------------- */
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .tag {
    font-family: var(--disp);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
  }
  .mono { font-family: var(--mono); }
  code, .code {
    font-family: var(--mono);
    background: rgba(192, 83, 47, 0.09);
    border: 1px solid rgba(192, 83, 47, 0.26);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 0.86em;
    color: var(--accent-ink);
  }
  .cite {
    font-family: var(--mono);
    font-size: 0.82em;
    color: var(--lime);
    background: rgba(79,115,20,0.1);
    border-radius: 4px;
    padding: 0 4px;
  }

  /* ===== Slide 1 — title ========================================= */
  .title-slide { justify-content: center; align-items: center; text-align: center; }
  .title-slide .eyebrow { font-size: 19px; justify-content: center; }
  .big-title {
    font-family: var(--disp);
    font-weight: 800;
    font-size: 104px;
    line-height: 0.98;
    letter-spacing: -0.02em;
    margin: 14px 0 0;
    max-width: 1100px;
  }
  .big-title .glow { color: var(--accent); }
  .title-q {
    margin-top: 46px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
    border-left: 3px solid var(--accent);
    background: rgba(192, 83, 47, 0.07);
    border-radius: 0 10px 10px 0;
    font-family: var(--mono);
    font-size: 21px;
    color: var(--white);
    max-width: 760px;
    text-align: left;
  }
  .title-q .qmark { color: var(--accent); font-size: 28px; }
  .byline {
    margin: 30px 0 0;
    font-family: var(--disp);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.12em;
    color: var(--accent);
  }

  /* ===== thank-you slide ========================================= */
  .thanks-row {
    margin-top: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
  }
  .qr-card {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(61, 52, 40, 0.1);
  }
  .qr-img {
    width: 230px;
    height: auto;
    display: block;
    border-radius: 6px;
  }
  .qr-card figcaption {
    font-family: var(--disp);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .thanks-note {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 440px;
    text-align: left;
  }
  .thanks-note li { display: flex; flex-direction: column; gap: 4px; }
  .thanks-note .v { font-size: 17px; line-height: 1.4; color: var(--white); }
  /* ===== generic two-column body ================================= */
  .cols {
    display: grid;
    gap: 28px;
    flex: 1;
    min-height: 0;
  }
  .cols.c12 { grid-template-columns: 1fr 1fr; }
  .cols.c-37 { grid-template-columns: 0.82fr 1.18fr; }
  .cols.c-55 { grid-template-columns: 1fr 1fr; }

  .figwrap {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .figwrap svg { width: 100%; height: auto; }
  figure { margin: 0; display: flex; flex-direction: column; height: 100%; }
  figcaption {
    margin-top: 12px;
    font-size: 15px;
    color: var(--dim);
    font-family: var(--mono);
    letter-spacing: 0.02em;
  }
  .rag-loop figcaption {
    margin-top: 8px;
    font-size: 16px;
    line-height: 1.35;
    color: var(--muted);
    max-width: 540px;
  }

  .note-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .note-list li {
    display: flex;
    gap: 14px;
    font-size: 18.5px;
    line-height: 1.4;
    color: var(--white);
  }
  .note-list li .k {
    flex: none;
    font-family: var(--disp);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cyan);
    width: 140px;
    padding-top: 2px;
  }
  .note-list li .k.vi { color: var(--violet); }
  .note-list li .k.mg { color: var(--magenta); }
  .note-list li .k.am { color: var(--amber); }
  .note-list li .k.lm { color: var(--lime); }
  .note-list li .v { color: var(--muted); }
  .note-list li .v b { color: var(--white); font-weight: 600; }

  .callout {
    margin-top: auto;
    padding: 14px 18px;
    border: 1px dashed rgba(176,116,0,0.4);
    background: rgba(176,116,0,0.06);
    border-radius: 10px;
    font-size: 17px;
    color: var(--amber);
    line-height: 1.4;
  }
  .callout b { color: var(--white); }

  /* ===== button-slide specific =================================== */
  .stepper {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
    margin-bottom: 22px;
  }
  .step {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 8px 10px;
    background: var(--panel-2);
    opacity: 0.4;
    transition: opacity 0.3s;
    overflow: hidden;
  }
  .step .n {
    font-family: var(--disp);
    font-weight: 700;
    font-size: 13px;
    color: var(--dim);
  }
  .step .nm {
    font-family: var(--disp);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.15;
    display: block;
  }
  .step.done { opacity: 1; }
  .step.done .n { color: var(--accent, var(--cyan)); }
  .step.active {
    opacity: 1;
    border-color: var(--accent, var(--cyan));
    background: color-mix(in srgb, var(--accent, var(--cyan)) 12%, var(--panel));
    box-shadow: 0 0 0 1px var(--accent, var(--cyan)), 0 6px 16px -8px rgba(40, 30, 20, 0.3);
  }
  .step.active .n, .step.active .nm { color: var(--accent, var(--cyan)); }
  .step.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: var(--accent, var(--cyan));
  }

  .bslide-body { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; flex: 1; min-height: 0; }

  .whatsnew { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .added-card {
    border: 1px solid var(--accent, var(--cyan));
    border-radius: 12px;
    padding: 16px 18px;
    background: color-mix(in srgb, var(--accent, var(--cyan)) 8%, var(--panel));
  }
  .added-card .tag { color: var(--accent, var(--cyan)); }
  .added-card .added-text {
    margin: 8px 0 0;
    font-size: 18px;
    line-height: 1.4;
    color: var(--white);
  }
  .added-card .added-text b { color: var(--accent, var(--cyan)); }

  .mech {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mech svg { width: 100%; height: auto; max-height: 276px; }

  /* answer card (right column) */
  .answer-card {
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }
  .answer-card .ac-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .ac-head .who { font-family: var(--disp); font-size: 13px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
  .verdict {
    font-family: var(--disp);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid currentColor;
  }
  .verdict.bad { color: var(--red); background: rgba(192,57,43,0.12); }
  .verdict.warn { color: var(--amber); background: rgba(176,116,0,0.12); }
  .verdict.ok { color: var(--cyan); background: rgba(14,125,148,0.12); }
  .verdict.good { color: var(--lime); background: rgba(79,115,20,0.12); }
  .verdict.mag { color: var(--magenta); background: rgba(165,44,117,0.12); }

  .ac-answer {
    margin: 0;
    padding: 16px 18px;
    font-size: 16px;
    line-height: 1.45;
    color: var(--white);
    flex: 1;
    min-height: 0;
    overflow: auto;
  }
  .ac-answer .tbl { font-family: var(--mono); color: var(--cyan); font-weight: 600; }
  .ac-answer .tbl.dep { color: var(--red); text-decoration: line-through; text-decoration-color: rgba(192,57,43,.6); }
  .ac-answer .hot { color: var(--amber); font-weight: 600; }

  .metrics {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    border-top: 1px solid var(--line);
  }
  .metric { padding: 13px 18px; }
  .metric + .metric { border-left: 1px solid var(--line); }
  .metric .tag { font-size: 11px; }
  .conf-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .conf-track { flex: 1; height: 7px; border-radius: 4px; background: rgba(40, 30, 20, 0.1); overflow: hidden; }
  .conf-track i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--cyan), var(--lime)); transition: width .5s; }
  .conf-num { font-family: var(--disp); font-weight: 700; font-size: 22px; min-width: 60px; }
  .rank-val { font-family: var(--disp); font-weight: 700; font-size: 24px; margin-top: 6px; }
  .rank-val small { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: .05em; }
  .delta { font-size: 13.5px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }
  .delta .up { color: var(--lime); }
  .delta .flat { color: var(--dim); }

  /* corpus grid (slide 5) */
  .corpus { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
  .doc {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 9px;
    background: var(--panel-2);
  }
  .doc .did { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .doc .dt { font-size: 13.5px; margin-top: 2px; line-height: 1.2; color: var(--white); }
  .doc .ds { font-family: var(--disp); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin-top: 5px; }
  .doc.dep { border-color: rgba(192,57,43,.5); background: rgba(192,57,43,.07); }
  .doc.dep .ds { color: var(--red); }
  .doc.key { border-color: rgba(14,125,148,.5); background: rgba(14,125,148,.07); }
  .doc.key .ds { color: var(--cyan); }
  .doc.pol { border-color: rgba(79,115,20,.4); }
  .doc.pol .ds { color: var(--lime); }
  .doc .ds.act { color: var(--dim); }
  /* de-emphasize the non-key docs so the eye lands on contracts vs. traps */
  .doc.pol, .doc.act { opacity: .4; filter: saturate(.55); padding: 5px 7px; }
  .doc.pol .dt, .doc.act .dt { font-size: 11.5px; }
  .doc.pol .did, .doc.act .did { font-size: 10.5px; }
  .doc.pol .ds, .doc.act .ds { font-size: 9px; margin-top: 3px; }
  /* a needed-later doc: brought partway forward */
  .doc.fwd { opacity: .82; filter: saturate(.85); padding: 7px 8px; }
  .doc.fwd .dt { font-size: 12.5px; }
  .doc.fwd .did { font-size: 11px; }
  .doc.fwd .ds { font-size: 9.5px; }

  .legend { display: flex; gap: 18px; margin-top: 14px; font-size: 14px; color: var(--muted); font-family: var(--mono); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; border: 1px solid; }
  .legend i.dep { border-color: var(--red); background: rgba(192,57,43,.2); }
  .legend i.key { border-color: var(--cyan); background: rgba(14,125,148,.2); }
  .legend i.pol { border-color: var(--lime); background: rgba(79,115,20,.2); }

  .pillrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .pill {
    font-family: var(--disp);
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 22px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .pill.on { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* takeaway pillars */
  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
  .pillar { border-radius: 12px; border: 1px solid var(--line); padding: 16px; background: var(--panel-2); }
  .pillar .pn { font-family: var(--disp); font-weight: 700; font-size: 17px; letter-spacing: .04em; }
  .pillar .pd { font-size: 15px; color: var(--muted); margin-top: 6px; line-height: 1.35; }

  svg text { font-family: var(--sans); font-weight: 500; }
  .svg-label { font-family: var(--disp); font-weight: 700; }

  /* live-demo overlay */
  #demoOverlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column;
    background: var(--bg);
    transform: translateY(100%);
    transition: transform .42s cubic-bezier(.22, .61, .36, 1);
    pointer-events: none;
  }
  #demoOverlay.open { transform: translateY(0); pointer-events: auto; }
  #demoBar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 18px;
    padding: 10px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel); font-family: var(--mono); font-size: 13px;
  }
  #demoBar .db-title {
    font-family: var(--disp); font-weight: 700; letter-spacing: .09em;
    color: var(--lime); display: flex; align-items: center; gap: 9px;
  }
  #demoBar .db-title::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--lime);
  }
  #demoBar .db-hint { color: var(--muted); }
  #demoBar .db-url { color: var(--cyan); font-size: 12px; opacity: .8; }
  #demoBar #demoReload, #demoBar #demoClose {
    background: transparent; border: 1px solid var(--line);
    color: var(--muted); border-radius: 8px; padding: 5px 12px; cursor: pointer;
    font-family: var(--mono); font-size: 13px; line-height: 1;
  }
  #demoBar #demoReload { margin-left: auto; }
  #demoBar #demoReload:hover, #demoBar #demoClose:hover { color: var(--white); border-color: var(--muted); }
  #demoFrame { flex: 1 1 auto; width: 100%; border: 0; background: var(--bg); }
  #demoFallback {
    position: absolute; inset: 44px 0 0 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px; color: var(--muted); font-family: var(--mono); font-size: 15px; line-height: 1.6;
  }
  #demoFallback code { color: var(--cyan); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { #demoOverlay { transition: none; } }
</style>

<div id="viewport">
  <div id="deck"></div>
</div>

<div id="hud">
  <span id="counter"><b>01</b> / 14</span>
  <div id="progress"><i></i></div>
  <span id="hint"><kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>F</kbd> fullscreen &nbsp;·&nbsp; <kbd>D</kbd> live demo</span>
</div>

    <text x="${bx+52}" y="${y+30}" font-size="14" fill="#3a342c">${s}</text>`).join('');

    <text x="36" y="176" font-size="13" fill="#3a342c">business_date = 2026-10-09</text>

function slideButton(b, idx) {
  const steps = BUTTONS.map((s)=>{
    const cls = s.n < b.n ? "done" : s.n === b.n ? "active" : "";
    return `<div class="step ${cls}" style="--accent:${s.accent}"><div class="n">0${s.n}</div><span class="nm">${s.name}</span></div>`;
  }).join("");
  const confPrev = b.n > 1 ? CONF[b.n-2] : null;
  return `<section class="slide" style="--accent:${b.accent}">
    <p class="eyebrow" style="color:${b.accent}">Button 0${b.n} of 07 <span class="seg">·</span> ${b.name}</p>

      <div class="stepper">${steps}</div>
      <div class="bslide-body">
        <div class="whatsnew">
          <div class="mech">${b.n===1?mechNaiveRankingOnly():b.mech}</div>
        </div>
        <div class="panel answer-card">

            <span class="who">▍ Chatbot response</span>

}

      <div class="pillar"><p class="pn" style="color:var(--magenta)">Authority</p><p class="pd">When sources conflict, let contracts and policies outrank Slack and snapshots.</p></div>
      <div class="pillar"><p class="pn" style="color:var(--lime)">Live evidence</p><p class="pd">Docs explain meaning; a query-time check decides whether today's data is usable.</p></div>
      <div class="pillar"><p class="pn" style="color:var(--amber)">Measure it</p><p class="pd">A pretty demo isn't an evaluation. Confidence here is illustrative — real trust needs a labelled test set.</p></div>
    </div>
  </section>`;
}

function slideEvals() {
  const w = 1040, h = 300, pad = 40, n = CORR.length;
  const bw = (w - 2*pad) / n * 0.56;
  const cx = CORR.map((_,i)=> pad + (i + 0.5)*(w-2*pad)/n);
  const col = p => p === 0 ? "var(--red)" : p < 80 ? "var(--amber)" : p < 100 ? "var(--cyan)" : "var(--lime)";
  const labels = BUTTONS.map(b=>b.name);
  return `<section class="slide">
    <p class="eyebrow">Measure it <span class="seg">·</span> part one <span class="seg">·</span> rule-based</p>
    <h2 class="headline">Grade every stage with a <span class="hl lime">rule-based rubric</span> against the final answer</h2>
    <div class="cols body" style="grid-template-columns:1.2fr 0.8fr">
      <figure class="figwrap" style="justify-content:center">
        <svg viewBox="0 0 1040 300" role="img" aria-label="Answer correctness versus the final tuned answer climbs from 0 to 100 percent across the seven stages">
          ${[0,25,50,75,100].map(g=>{const y=h-30-(g/100)*(h-70);return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#e7e0d2"/><text x="${pad-8}" y="${y+4}" font-size="13" fill="#8d8472" text-anchor="end">${g}</text>`;}).join('')}
          ${CORR.map((p,i)=>{
            const bh = (p/100)*(h-70);
            const y = h-30-bh;
            const x = cx[i]-bw/2;
            const bar = p === 0
              ? `<line x1="${x.toFixed(1)}" y1="${(h-30).toFixed(1)}" x2="${(x+bw).toFixed(1)}" y2="${(h-30).toFixed(1)}" stroke="${col(p)}" stroke-width="3"/>`
              : `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${col(p)}" fill-opacity="0.85"/>`;
            return `${bar}
            <text x="${cx[i].toFixed(1)}" y="${(y-10).toFixed(1)}" font-size="15" fill="${col(p)}" text-anchor="middle" class="svg-label" font-weight="700">${p}%</text>
            <text x="${cx[i].toFixed(1)}" y="${h-12}" font-size="13" fill="#6a6153" text-anchor="middle">0${i+1}</text>
            <text x="${cx[i].toFixed(1)}" y="${h-1}" font-size="13" fill="#8d8472" text-anchor="middle">${labels[i].split(' ')[0]}</text>`;
          }).join('')}
        </svg>
        <figcaption>Answer-correctness vs. the fully-tuned final answer &mdash; scored by <code>scripts/eval_confidence.py</code> (n&nbsp;=&nbsp;7).</figcaption>
      </figure>
      <ul class="note-list" style="justify-content:center;gap:18px">
        <li><span class="k lm">What we graded</span><span class="v">The <b>final tuned answer is the rubric</b> &mdash; each stage scores on how many of its 5 properties it reproduces.</span></li>
        <li><span class="k">The 5 checks</span><span class="v">Right table &middot; no invented freshness &middot; flags currency &middot; freshness governance &middot; readiness resolved.</span></li>
        <li><span class="k am">How</span><span class="v"><b>Rule-based &amp; deterministic</b> &mdash; fixed rules, reproducible from the result JSON. No model in the loop, no calibrated probability.</span></li>
      </ul>
    </div>
  </section>`;
}

function slideEvalsModel() {
  const w = 1040, h = 300, pad = 40, n = CONF.length;
  const xs = CONF.map((_,i)=> pad + i*(w-2*pad)/(n-1));
  const ys = CONF.map(c => h-30 - (c/100)*(h-70));
  const line = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const area = `${pad},${h-30} ${line} ${xs[n-1].toFixed(1)},${h-30}`;
  const col = p => p === 0 ? "var(--red)" : p < 80 ? "var(--amber)" : p < 100 ? "var(--cyan)" : "var(--lime)";
  const labels = BUTTONS.map(b=>b.name);
  return `<section class="slide">
    <p class="eyebrow">Measure it <span class="seg">·</span> score every stage with an LLM judge</p>
    <h2 class="headline">Don't trust the climb &mdash; <span class="hl mag">grade every stage</span> with an <span class="hl mag">LLM-as-judge</span></h2>
    <div class="cols body" style="grid-template-columns:1.2fr 0.8fr">
      <figure class="figwrap" style="justify-content:center">
        <svg viewBox="0 0 1040 300" role="img" aria-label="An LLM-as-judge evaluator scores answer quality from 0 to 100 percent, climbing across the seven pipeline stages">
          <defs>
            <linearGradient id="judgeFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#9b2d8f" stop-opacity="0.32"/>
              <stop offset="100%" stop-color="#9b2d8f" stop-opacity="0.02"/>
            </linearGradient>
            <linearGradient id="judgeLine" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#c0392b"/><stop offset="50%" stop-color="#9b2d8f"/><stop offset="100%" stop-color="#4f7314"/>
            </linearGradient>
          </defs>
          ${[0,25,50,75,100].map(g=>{const y=h-30-(g/100)*(h-70);return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#e7e0d2"/><text x="${pad-8}" y="${y+4}" font-size="13" fill="#8d8472" text-anchor="end">${g}</text>`;}).join('')}
          <polygon points="${area}" fill="url(#judgeFill)"/>
          <polyline points="${line}" fill="none" stroke="url(#judgeLine)" stroke-width="3"/>
          ${CONF.map((p,i)=>`
            <circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i===0||i===n-1?6:4.5}" fill="${col(p)}" stroke="#f7f2ea" stroke-width="2"/>
            <text x="${xs[i].toFixed(1)}" y="${(ys[i]-14).toFixed(1)}" font-size="15" fill="${col(p)}" text-anchor="middle" class="svg-label" font-weight="700">${p}%</text>
            <text x="${xs[i].toFixed(1)}" y="${h-12}" font-size="13" fill="#6a6153" text-anchor="middle">0${i+1}</text>
            <text x="${xs[i].toFixed(1)}" y="${h-1}" font-size="13" fill="#8d8472" text-anchor="middle">${labels[i].split(' ')[0]}</text>
          `).join('')}
        </svg>
        <figcaption>Answer quality per stage &mdash; scored by an <b>LLM-as-judge</b> evaluator against the retrieved evidence (scores illustrative).</figcaption>
      </figure>
      <ul class="note-list" style="justify-content:center;gap:18px">
        <li><span class="k mg">What it is</span><span class="v">A <b>pretrained evaluator model</b> (LLM-as-judge) reads each stage's answer plus its evidence and scores quality &mdash; no hand-written keyword rules.</span></li>
        <li><span class="k">What it scores</span><span class="v"><b>Faithfulness</b> to the evidence, relevance to the question, and completeness &mdash; folded into one percentage per stage.</span></li>
        <li><span class="k lm">Why it scales</span><span class="v">Grades <b>thousands of answers</b> automatically, catching hallucinations a keyword rubric misses.</span></li>
        <li><span class="k am">The catch</span><span class="v">The judge is itself a model &mdash; <b>calibrate it against human labels</b> before you trust the number.</span></li>
      </ul>
    </div>
  </section>`;
}

/* ======================================================================
   ASSEMBLE + NAVIGATION
   ====================================================================== */
const slides = [
  slideTitle(),
  slideWhatIsRag(),
  slideChunking(),
  slideIndexing(),
  slideRetrievalRerank(),
  slideUseCase(),
  ...BUTTONS.map((b,i)=>slideButton(b,i)),
  slideEvals(),
  slideEvalsModel(),
  slideTakeaway(),
  slideThanks(),
];
const deck = document.getElementById("deck");
deck.innerHTML = slides.join("");
const slideEls = [...deck.querySelectorAll(".slide")];
const total = slideEls.length;

let cur = 0;
const counter = document.getElementById("counter");
const progressBar = document.querySelector("#progress i");

function show(i) {
  cur = Math.max(0, Math.min(total - 1, i));
  slideEls.forEach((s, idx) => s.classList.toggle("active", idx === cur));
  counter.innerHTML = `<b>${String(cur + 1).padStart(2, "0")}</b> / ${total}`;
  progressBar.style.width = `${((cur + 1) / total) * 100}%`;
  location.hash = String(cur + 1);
}
function next() { show(cur + 1); }
function prev() { show(cur - 1); }

/* ---- live demo overlay ------------------------------------------------
   Embeds the running demo (scripts/ui_server.py, default port 8765) in an
   iframe. Override the address with ?demo=http://host:port/ if you run the
   server somewhere else. */
const DEMO_URL = (() => {
  const q = new URLSearchParams(location.search).get("demo");
  if (q) return q;
  // If the deck itself is served FROM the demo server, same-origin works;
  // otherwise fall back to the demo server's default local address.
  if (location.port === "8765") return "/";
  return "http://127.0.0.1:8765/";
})();
const overlay = document.getElementById("demoOverlay");
const demoFrame = document.getElementById("demoFrame");
const fallback = document.getElementById("demoFallback");
document.getElementById("demoUrl").textContent = DEMO_URL;
let demoOpen = false, fallbackTimer = null;

demoFrame.addEventListener("load", () => {
  // a real page (not about:blank) came back → hide the "server down" hint
  if (demoFrame.src && !demoFrame.src.startsWith("about:")) {
    demoFrame.dataset.loaded = "1";
    fallback.style.display = "none";
    clearTimeout(fallbackTimer);
  }
  // Same-origin demo (deck served FROM the demo server): once you click into
  // the frame, focus lives inside it and the deck's own keydown never fires.
  // Mirror the handler into the frame so D / Esc still return to the slides.
  // Cross-origin demos throw on contentDocument access — that path relies on
  // the focus-return below (mouse over the deck chrome) and the ✕ button.
  try {
    const doc = demoFrame.contentDocument;
    if (doc) { doc.removeEventListener("keydown", handleKey); doc.addEventListener("keydown", handleKey); }
  } catch { /* cross-origin: can't reach into the frame */ }
});

function loadDemo() {
  // force a fresh load even if the URL is unchanged (about:blank → real url)
  fallback.style.display = "none";
  demoFrame.dataset.loaded = "";
  demoFrame.src = "about:blank";
  requestAnimationFrame(() => { demoFrame.src = DEMO_URL; });
  clearTimeout(fallbackTimer);
  fallbackTimer = setTimeout(() => {
    if (!demoFrame.dataset.loaded) fallback.style.display = "flex";
  }, 3000);
}
function openDemo() {
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  demoOpen = true;
  if (!demoFrame.dataset.loaded) loadDemo();   // first open, or after a failed attempt
}
function closeDemo() {
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");
  demoOpen = false;
}
function toggleDemo() { demoOpen ? closeDemo() : openDemo(); }
document.getElementById("demoClose").addEventListener("click", closeDemo);
document.getElementById("demoReload").addEventListener("click", loadDemo);

// Cross-origin fallback: while the demo iframe holds focus, the deck can't see
// key presses. The top bar is part of the DECK (outside the frame), so moving
// the pointer onto it hands focus back — then D / Esc reach the slides again.
document.getElementById("demoBar").addEventListener("pointerenter", () => window.focus());

// Robust return path: the demo (iframe) forwards Esc / D up to us via
// postMessage. Unlike the same-origin keydown mirror above, this works even
// when the demo is served cross-origin and keeps working after the user has
// clicked into the frame (focus is trapped inside it).
window.addEventListener("message", (e) => {
  const msg = e.data;
  if (!msg || msg.type !== "deck-key") return;
  if (msg.key === "Escape") { if (demoOpen) closeDemo(); }
  else if (msg.key === "d" || msg.key === "D") { toggleDemo(); }
});

function handleKey(e) {
  const k = e.key.toLowerCase();
  if (k === "d") { e.preventDefault(); toggleDemo(); return; }
  if (e.key === "Escape") { if (demoOpen) { e.preventDefault(); closeDemo(); } return; }
  if (k === "f") {
    e.preventDefault();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
    return;
  }
  if (demoOpen) return;   // slides stay put while the demo is up
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "Home") { show(0); }
  else if (e.key === "End") { show(total - 1); }
}
document.addEventListener("keydown", handleKey);

// click to advance (ignore clicks on the HUD / left third = back)
document.getElementById("viewport").addEventListener("click", (e) => {
  if (demoOpen) return;
  const x = e.clientX / window.innerWidth;
  if (x < 0.25) prev(); else next();
});

// scale the fixed 1280x720 deck to fit the viewport
function fit() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  deck.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit);
fit();

const start = parseInt(location.hash.replace("#", ""), 10);
show(Number.isFinite(start) && start >= 1 ? start - 1 : 0);
</script>
</body>
</html>
